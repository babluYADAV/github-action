name: third workflow
on: push
jobs:
    validate-html-files:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Validate html files
              run: test -f index.html




    validate-js-files:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Validate js files
              run: test -f script.js
              

    validate-code:
        needs: [validate-html-files, validate-js-files]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Validate js code
              run: node --check  script.js

            - name: Validate html code
              run: tidy -e index.html