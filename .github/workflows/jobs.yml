name: sequential jobs workflow
on: push
jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run job 1
              run: echo "This is job 1"

    job2:
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run job 2
              run: echo "This is job 2"